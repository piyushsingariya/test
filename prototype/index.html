<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piyush Singariya — prototype walkthrough</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="shell-rail">
        <a class="shell-brand" href="#/visitor/home">Piyush Singariya
          <span class="shell-brand-sub">Prototype walkthrough</span>
        </a>

        <p class="shell-note">A clickable walkthrough, not the site. Nothing sends, downloads or signs
          anything in, and every line still marked as sample is waiting on Piyush to confirm it.</p>

        <nav id="index" aria-label="Screens"></nav>
      </aside>

      <main class="shell-main">
        <div class="shell-bar">
          <span class="shell-bar-title" id="screen-title">Piyush Singariya</span>
          <span class="shell-bar-persona" id="screen-persona"></span>
        </div>
        <div class="stage" id="stage" data-platform="desktop">
          <div class="stage-frame" data-mount></div>
        </div>
      </main>
    </div>

    <script>
      var START = "visitor/home";

      var ORDER = [
        "visitor/home",
        "visitor/work",
        "visitor/work-meshery",
        "visitor/writing",
        "visitor/cv",
        "visitor/contact",
        "visitor/design",
        "phone/home",
        "phone/work",
        "phone/work-meshery",
        "phone/writing",
        "phone/cv",
        "phone/contact"
      ];

      var PERSONAS = {
        visitor: { label: "Visitor — desktop", platform: "desktop" },
        phone: { label: "Visitor — phone", platform: "mobile" }
      };

      var templates = Array.prototype.slice.call(
        document.querySelectorAll("template[data-screen]")
      );

      var screens = templates.map(function (template) {
        var route = String(template.getAttribute("data-screen") || "");
        var parts = route.split("/");
        return {
          route: route,
          persona: parts[0] || "",
          name: parts[1] || "",
          title: template.getAttribute("data-title") || route,
          template: template
        };
      });

      var byRoute = {};
      screens.forEach(function (screen) {
        byRoute[screen.route] = screen;
      });

      var mount = document.querySelector("[data-mount]");
      var stage = document.getElementById("stage");
      var titleEl = document.getElementById("screen-title");
      var personaEl = document.getElementById("screen-persona");
      var indexEl = document.getElementById("index");

      function personaOf(id) {
        return PERSONAS[id] || { label: id || "Screens", platform: "desktop" };
      }

      function buildIndex() {
        indexEl.textContent = "";

        if (!screens.length) {
          var empty = document.createElement("p");
          empty.className = "index-empty";
          empty.textContent = "No screens yet.";
          indexEl.appendChild(empty);
          return;
        }

        var order = Object.keys(PERSONAS).filter(function (id) {
          return screens.some(function (screen) { return screen.persona === id; });
        });

        screens.forEach(function (screen) {
          if (order.indexOf(screen.persona) === -1) { order.push(screen.persona); }
        });

        order.forEach(function (id) {
          var group = document.createElement("div");
          group.className = "index-group";

          var label = document.createElement("p");
          label.className = "index-label";
          label.textContent = personaOf(id).label;
          group.appendChild(label);

          var list = document.createElement("ul");
          list.className = "index-list";

          screens
            .filter(function (screen) { return screen.persona === id; })
            .forEach(function (screen) {
              var item = document.createElement("li");
              var link = document.createElement("a");
              link.className = "index-link";
              link.href = "#/" + screen.route;
              link.textContent = screen.title;
              link.setAttribute("data-route", screen.route);
              item.appendChild(link);
              list.appendChild(item);
            });

          group.appendChild(list);
          indexEl.appendChild(group);
        });
      }

      function routeFromHash() {
        var hash = String(location.hash || "").replace(/^#\/?/, "");
        return hash.split("?")[0];
      }

      function show() {
        if (!screens.length) { return; }

        var screen = byRoute[routeFromHash()] || byRoute[START] || screens[0];
        var persona = personaOf(screen.persona);

        mount.replaceChildren(screen.template.content.cloneNode(true));
        stage.setAttribute("data-platform", persona.platform);
        titleEl.textContent = screen.title;
        personaEl.textContent = persona.label;
        document.title = "Piyush Singariya — " + screen.title;
        stage.scrollTop = 0;
        window.scrollTo(0, 0);

        Array.prototype.forEach.call(
          indexEl.querySelectorAll(".index-link"),
          function (link) {
            if (link.getAttribute("data-route") === screen.route) {
              link.setAttribute("aria-current", "page");
            } else {
              link.removeAttribute("aria-current");
            }
          }
        );
      }

      screens.sort(function (a, b) {
        var oa = ORDER.indexOf(a.route);
        var ob = ORDER.indexOf(b.route);
        if (oa === -1) { oa = ORDER.length; }
        if (ob === -1) { ob = ORDER.length; }
        if (oa !== ob) { return oa - ob; }
        return a.route < b.route ? -1 : a.route > b.route ? 1 : 0;
      });

      buildIndex();
      show();
      window.addEventListener("hashchange", show);
    </script>
  </body>
</html>

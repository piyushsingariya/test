<template data-screen="admin/install" data-title="Add Vendi to Slack">
  <div class="page">
    <section class="section">
      <div class="btn-row btn-row-spread">
        <div>
          <p class="eyebrow">Story 3 &middot; Dana Okafor, workspace admin</p>
          <h1 class="title">Dana adds Vendi to Northwind's Slack</h1>
        </div>
        <span class="tag tag-sample">Sample workspace &mdash; made up for this walkthrough</span>
      </div>
      <p class="lede">Nobody in the company can use Vendi until an admin installs it. This is the screen Slack puts up: what Vendi is asking for, in Slack's own words, and what it is deliberately not asking for.</p>

      <ul class="steps mt-lg">
        <li class="step step-now"><span class="step-num">1</span> Add to Slack</li>
        <li class="step-arrow" aria-hidden="true">&rarr;</li>
        <li class="step"><span class="step-num">2</span> Invite to channels</li>
        <li class="step-arrow" aria-hidden="true">&rarr;</li>
        <li class="step"><span class="step-num">3</span> Connect Notion</li>
        <li class="step-arrow" aria-hidden="true">&rarr;</li>
        <li class="step"><span class="step-num">4</span> Choose what it reads</li>
      </ul>
    </section>

    <section class="section section-sunken">
      <div class="consent">
        <div class="consent-head">
          <div class="consent-marks">
            <span class="consent-mark consent-mark-vendi" aria-hidden="true">V</span>
            <span class="consent-join" aria-hidden="true">&rarr;</span>
            <span class="consent-mark consent-mark-slack" aria-hidden="true">#</span>
          </div>
          <h2 class="consent-title">Vendi is requesting permission to access the Northwind Slack workspace</h2>
          <p class="consent-note">You are signed in as Dana Okafor, workspace owner of Northwind.</p>
        </div>

        <div class="consent-body">
          <p class="consent-label">Vendi will be able to</p>
          <ul class="scope-list">
            <li class="scope">
              <span class="scope-mark" aria-hidden="true">&check;</span>
              <span class="scope-text">Read messages in public channels it is invited to
                <span class="scope-note">Only channels someone adds it to. It is not in any channel yet.</span>
              </span>
            </li>
            <li class="scope">
              <span class="scope-mark" aria-hidden="true">&check;</span>
              <span class="scope-text">Post messages and reply in threads
                <span class="scope-note">Answers and summaries, where it was asked.</span>
              </span>
            </li>
            <li class="scope">
              <span class="scope-mark" aria-hidden="true">&check;</span>
              <span class="scope-text">Send and receive direct messages
                <span class="scope-note">So people can ask it privately, and so it can take a proposed wiki edit to a page's owner.</span>
              </span>
            </li>
            <li class="scope">
              <span class="scope-mark" aria-hidden="true">&check;</span>
              <span class="scope-text">See the workspace's channels and members
                <span class="scope-note">To know who can see what, and to answer each person only from what they could open themselves.</span>
              </span>
            </li>
          </ul>

          <p class="consent-label mt-lg">Vendi is not asking for</p>
          <ul class="scope-list">
            <li class="scope">
              <span class="scope-mark scope-mark-no" aria-hidden="true">&times;</span>
              <span class="scope-text">Private channels it has not been invited to</span>
            </li>
            <li class="scope">
              <span class="scope-mark scope-mark-no" aria-hidden="true">&times;</span>
              <span class="scope-text">Direct messages between other people</span>
            </li>
            <li class="scope">
              <span class="scope-mark scope-mark-no" aria-hidden="true">&times;</span>
              <span class="scope-text">Changing anything in Slack &mdash; no renaming, archiving, inviting or removing</span>
            </li>
          </ul>
        </div>

        <div class="consent-foot">
          <span class="consent-foot-note">You can remove Vendi from the workspace at any time.</span>
          <a class="btn" href="#/visitor/home">Cancel</a>
          <a class="btn btn-primary" href="#/admin/invite">Allow</a>
        </div>
      </div>

      <p class="fake-note mt-md">A drawing of Slack's install screen, not Slack's. Nothing installs. <em>Allow</em> moves this walkthrough to the next screen; <em>Cancel</em> goes back to the start.</p>
    </section>

    <section class="section">
      <h2 class="title">What installing does and does not do</h2>
      <div class="grid-3 mt-lg">
        <article class="card">
          <h3 class="card-title">Vendi becomes a member</h3>
          <p class="card-body">After this, Vendi shows up in the workspace as an app people can mention in a channel or message directly &mdash; the same as any other member of Northwind.</p>
        </article>
        <article class="card">
          <h3 class="card-title">It has read nothing yet</h3>
          <p class="card-body">Installing gives Vendi permission, not knowledge. It is in no channel and has no wiki until Dana invites it and connects Notion on the next two screens.</p>
        </article>
        <article class="card">
          <h3 class="card-title">It never widens what anyone can see</h3>
          <p class="card-body">Vendi answers each person only from the channels and pages that person could already open. An admin installing it does not change one person's access.</p>
        </article>
      </div>
    </section>

    <div class="walk-foot">
      <span class="walk-foot-note">Story 3 &middot; screen 1 of 7 &middot; Admin</span>
      <span class="walk-foot-links">
        <a class="walk-link walk-link-home" href="#/visitor/home">&larr; Back to the start</a>
        <a class="walk-link" href="#/admin/invite">Invite it to channels &rarr;</a>
      </span>
    </div>
  </div>
</template>

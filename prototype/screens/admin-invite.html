        <div class="slack-main">

            <span class="slack-channel">#support</span>
            <span class="slack-head-note">31 members &middot; Vendi added just now</span>
          </div>

          <div class="slack-body">
            <p class="slack-day">Today</p>

            <p class="slack-meta">Dana Okafor added <strong>Vendi</strong> to the channel.</p>

            <div class="slack-message">
              <span class="slack-avatar slack-avatar-vendi" aria-hidden="true">V</span>
              <div>
                <p class="slack-author">Vendi <span class="slack-app-badge">APP</span> <span class="slack-time">09:14</span></p>
                <p class="slack-text">Hello &mdash; I am in #support now. Mention me with a question and I will answer from what this workspace and the company wiki already say, and show you what I read. Ask me to summarise a thread and I will post the summary in it.</p>
                <p class="slack-meta">Two things worth knowing on my first day here:</p>
                <ul class="slack-facts">
                  <li class="slack-fact">I have read nothing yet &mdash; the wiki is not connected</li>
                  <li class="slack-fact">I only answer from what you can already open</li>
                </ul>
                <p class="slack-access">I read this channel because someone invited me to it. I cannot see a private channel I am not in, and I cannot read anyone's direct messages.</p>

      <div class="grid-2 mt-lg">
        <article class="card">
          <h3 class="card-title">Two ways to invite it</h3>
          <p class="card-body">Type <code>/invite @Vendi</code> in the channel, or open the channel's integrations and add Vendi there. Either way Vendi posts the message above, so the channel knows it arrived.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Removing it is the same move</h3>
          <p class="card-body">Remove Vendi from a channel and it stops reading that channel from that moment. What it already answered stays in the log; the channel does not feed new answers.</p>
        </article>
      </div>

      <p class="fake-note mt-md">Sample channels, sample names and sample times. Nothing on this screen is connected to a Slack workspace.</p>

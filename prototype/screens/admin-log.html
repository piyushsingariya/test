<template data-screen="admin/log" data-title="Activity log">
  <div class="page">
    <section class="section">
      <div class="btn-row btn-row-spread">
        <div>
          <p class="eyebrow">Story 3 &middot; Dana Okafor, workspace admin</p>
          <h1 class="title">Everything Vendi has said, in one list Dana can scan</h1>
        </div>
        <span class="tag tag-sample">Sample workspace &mdash; made up for this walkthrough</span>
      </div>
      <p class="lede">Every answer, every summary and every wiki change Vendi proposed, made or had declined. Newest first, with what it read. Any row opens.</p>
    </section>

    <section class="section section-sunken">
      <ul class="tally">
        <li class="tally-item">
          <span class="tally-num">128</span>
          <span class="tally-key">Answers</span>
        </li>
        <li class="tally-item">
          <span class="tally-num">19</span>
          <span class="tally-key">Summaries</span>
        </li>
        <li class="tally-item">
          <span class="tally-num">6</span>
          <span class="tally-key">Wiki edits proposed</span>
        </li>
        <li class="tally-item">
          <span class="tally-num">4</span>
          <span class="tally-key">Accepted by an owner</span>
        </li>
        <li class="tally-item">
          <span class="tally-num">1</span>
          <span class="tally-key">Declined</span>
        </li>
        <li class="tally-item">
          <span class="tally-num">11</span>
          <span class="tally-key">Times it said it did not know</span>
        </li>
      </ul>
      <p class="fake-note mt-xs">Sample figures for a made-up workspace over the last 7 days. They are not a claim about anything.</p>

      <div class="console mt-lg">
        <div class="console-head">
          <div>
            <p class="console-title">Activity</p>
            <p class="row-note">Northwind &middot; last 7 days &middot; 9 of 164 entries shown</p>
          </div>
          <span class="btn-row">
            <input type="search" class="input" placeholder="Search what Vendi said">
            <span class="field">
              <span class="field-label">Period</span>
              <select class="select">
                <option>Last 7 days</option>
                <option>Last 30 days</option>
                <option>Last 90 days</option>
                <option>Everything</option>
              </select>
            </span>
            <button type="button" class="btn">Export CSV</button>
          </span>
        </div>

        <div class="console-pad">
          <div class="filter-row">
            <a class="filter-chip" href="#/admin/log" aria-current="page">All</a>
            <a class="filter-chip" href="#/admin/log">Answers</a>
            <a class="filter-chip" href="#/admin/log">Summaries</a>
            <a class="filter-chip" href="#/admin/log">Wiki changes</a>
            <a class="filter-chip" href="#/admin/log">Said it did not know</a>
            <a class="filter-chip" href="#/admin/log">Direct messages</a>
          </div>
        </div>

        <table class="log-table">
          <thead>
            <tr>
              <th scope="col">When</th>
              <th scope="col">Kind</th>
              <th scope="col">What Vendi did</th>
              <th scope="col">Person</th>
              <th scope="col"><span class="visually-hidden">Open</span></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="log-when">Today 10:52</td>
              <td class="log-kind"><span class="tag tag-good">Wiki change</span></td>
              <td>
                <span class="log-what">Updated <strong>Refunds policy</strong> &mdash; rewrote the &ldquo;Approval time&rdquo; section</span>
                <span class="log-where">Notion &middot; Finance / Refunds policy &middot; accepted by the page's owner</span>
              </td>
              <td class="log-who">Marco Alvarez</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
            <tr>
              <td class="log-when">Today 10:44</td>
              <td class="log-kind"><span class="tag tag-quiet">Wiki change proposed</span></td>
              <td>
                <span class="log-what">Proposed an edit to <strong>Refunds policy</strong> and sent it to the page's owner</span>
                <span class="log-where">Direct message to Marco Alvarez &middot; drawn from #finance-ops and #support</span>
              </td>
              <td class="log-who">Marco Alvarez</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
            <tr>
              <td class="log-when">Today 10:42</td>
              <td class="log-kind"><span class="tag tag-quiet">Answer</span></td>
              <td>
                <span class="log-what">Answered &ldquo;how long do refund requests take to approve now?&rdquo;</span>
                <span class="log-where">#support &middot; read 3 sources &middot; flagged that the wiki disagreed</span>
              </td>
              <td class="log-who">Priya Raman</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
            <tr>
              <td class="log-when">Today 10:39</td>
              <td class="log-kind"><span class="tag tag-accent">Summary</span></td>
              <td>
                <span class="log-what">Summarised a 34-reply thread in the thread itself</span>
                <span class="log-where">#support &middot; covered 34 replies from 9 people</span>
              </td>
              <td class="log-who">Priya Raman</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
            <tr>
              <td class="log-when">Today 09:58</td>
              <td class="log-kind"><span class="tag tag-warm">Said it did not know</span></td>
              <td>
                <span class="log-what">Could not answer &ldquo;how much carry-over leave can I take into next year?&rdquo; and said so</span>
                <span class="log-where">Direct message &middot; looked in 4 places &middot; pointed at People ops</span>
              </td>
              <td class="log-who">Tomas Weber</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
            <tr>
              <td class="log-when">Yesterday 17:20</td>
              <td class="log-kind"><span class="tag tag-accent">Summary</span></td>
              <td>
                <span class="log-what">Summarised #support over 7 days, then shorter, then only the refund threads</span>
                <span class="log-where">#support &middot; 3 versions of one summary</span>
              </td>
              <td class="log-who">Priya Raman</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
            <tr>

              <td>

              </td>
              <td class="log-who">Marco Alvarez</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
            <tr>
              <td class="log-when">Yesterday 11:12</td>
              <td class="log-kind"><span class="tag tag-quiet">Wiki change declined</span></td>
              <td>

                <span class="log-what">Answered &ldquo;which channels do you read?&rdquo; with the four it reads and the one it does not</span>

              </td>
              <td class="log-who">Dana Okafor</td>
              <td class="log-open"><a class="btn btn-quiet" href="#/admin/entry">Open</a></td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="fake-note mt-md">Sample entries, sample people, sample times. The search box, the period, the filters and <em>Export CSV</em> do nothing here &mdash; and in this walkthrough every <em>Open</em> leads to the same drawn entry.</p>
    </section>

    <section class="section">
      <h2 class="title">What the log is for</h2>
      <div class="grid-3 mt-lg">
        <article class="card">
          <h3 class="card-title">Checking Vendi, not watching people</h3>
          <p class="card-body">An entry records what Vendi did: what it was asked, what it said and what it read. It is Vendi that is being audited.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Admins only</h3>
          <p class="card-body">This screen is for workspace admins. Direct-message entries are in it, because an admin who cannot see what Vendi said in a DM cannot audit it at all.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Every wiki change is traceable</h3>
          <p class="card-body">Proposed, accepted, declined: each one keeps the conversation it came from and the owner who decided, so a page's history and this log agree.</p>
        </article>
      </div>
    </section>

    <div class="walk-foot">
      <span class="walk-foot-note">Story 3 &middot; screen 6 of 7 &middot; Admin</span>
      <span class="walk-foot-links">
        <a class="walk-link walk-link-home" href="#/visitor/home">&larr; Back to the start</a>
        <a class="walk-link" href="#/admin/sources">Connected sources</a>
        <a class="walk-link" href="#/admin/entry">Open one entry &rarr;</a>
      </span>
    </div>

</template>

<template data-screen="admin/notion" data-title="Connect Notion">
  <div class="page">
    <section class="section">
      <div class="btn-row btn-row-spread">
        <div>
          <p class="eyebrow">Story 3 &middot; Dana Okafor, workspace admin</p>
          <h1 class="title">Dana connects the Notion wiki, page by page</h1>
        </div>
        <span class="tag tag-sample">Sample workspace &mdash; made up for this walkthrough</span>
      </div>
      <p class="lede">Notion is the only wiki Vendi reads. Dana chooses which parts of it Vendi gets &mdash; not the whole workspace by default.</p>

      <ul class="steps mt-lg">
        <li class="step step-done"><span class="step-num">&check;</span> Add to Slack</li>
        <li class="step-arrow" aria-hidden="true">&rarr;</li>
        <li class="step step-done"><span class="step-num">&check;</span> Invite to channels</li>
        <li class="step-arrow" aria-hidden="true">&rarr;</li>
        <li class="step step-now"><span class="step-num">3</span> Connect Notion</li>
        <li class="step-arrow" aria-hidden="true">&rarr;</li>
        <li class="step"><span class="step-num">4</span> Choose what it reads</li>
      </ul>
    </section>

    <section class="section section-sunken">
      <div class="consent">
        <div class="consent-head">
          <div class="consent-marks">
            <span class="consent-mark consent-mark-vendi" aria-hidden="true">V</span>
            <span class="consent-join" aria-hidden="true">&rarr;</span>
            <span class="consent-mark consent-mark-notion" aria-hidden="true">N</span>
          </div>
          <h2 class="consent-title">Vendi wants access to pages in Northwind wiki</h2>
          <p class="consent-note">You are signed in to Notion as Dana Okafor.</p>
        </div>

        <div class="consent-body">
          <p class="consent-label">Choose the pages Vendi can read</p>
          <div class="choice-box">
            <ul class="choice-list">
              <li class="choice">
                <input type="checkbox" class="check" id="pick-handbook" checked>
                <span>
                  <label class="choice-title" for="pick-handbook">Company handbook</label>
                  <span class="choice-note">28 pages &middot; how the company works, for everyone</span>
                </span>
                <span><span class="tag tag-good">Selected</span></span>
              </li>
              <li class="choice">
                <input type="checkbox" class="check" id="pick-finance" checked>
                <span>
                  <label class="choice-title" for="pick-finance">Finance</label>
                  <span class="choice-note">12 pages &middot; includes Refunds policy, Expense limits</span>
                </span>
                <span><span class="tag tag-good">Selected</span></span>
              </li>
              <li class="choice">
                <input type="checkbox" class="check" id="pick-support" checked>
                <span>
                  <label class="choice-title" for="pick-support">Support</label>
                  <span class="choice-note">9 pages &middot; playbooks and status wording</span>
                </span>
                <span><span class="tag tag-good">Selected</span></span>
              </li>
              <li class="choice">
                <input type="checkbox" class="check" id="pick-people" checked>
                <span>
                  <label class="choice-title" for="pick-people">People ops</label>
                  <span class="choice-note">14 pages &middot; leave, onboarding, equipment</span>
                </span>
                <span><span class="tag tag-good">Selected</span></span>
              </li>
              <li class="choice">
                <input type="checkbox" class="check" id="pick-eng">
                <span>
                  <label class="choice-title" for="pick-eng">Engineering handbook</label>
                  <span class="choice-note">31 pages &middot; left out for now; engineering wants to review it first</span>
                </span>
                <span><span class="tag tag-quiet">Not selected</span></span>
              </li>
              <li class="choice">
                <input type="checkbox" class="check" id="pick-board" disabled>
                <span>
                  <label class="choice-title" for="pick-board">Board and compensation</label>
                  <span class="choice-note">6 pages &middot; restricted in Notion. Dana is not giving Vendi this, and cannot from here.</span>
                </span>
                <span><span class="tag tag-warm">Restricted</span></span>
              </li>
            </ul>
          </div>
          <p class="consent-note">63 pages selected across 4 top-level pages.</p>

          <p class="consent-label mt-lg">Vendi will be able to</p>
          <ul class="scope-list">
            <li class="scope">
              <span class="scope-mark" aria-hidden="true">&check;</span>
              <span class="scope-text">Read the pages selected above, and their sub-pages
                <span class="scope-note">To answer from them and to show them as the source of an answer.</span>
              </span>
            </li>
            <li class="scope">
              <span class="scope-mark" aria-hidden="true">&check;</span>
              <span class="scope-text">See each page's owner and when it was last edited
                <span class="scope-note">So a proposed edit goes to the right person, and so a stale page can be spotted.</span>
              </span>
            </li>
            <li class="scope">
              <span class="scope-mark" aria-hidden="true">&check;</span>
              <span class="scope-text">Write to a page, only after that page's owner accepts an edit
                <span class="scope-note">Vendi drafts the change and asks. Until the owner says yes, the page is untouched.</span>
              </span>
            </li>
          </ul>

          <p class="consent-label mt-lg">Vendi is not asking for</p>
          <ul class="scope-list">
            <li class="scope">
              <span class="scope-mark scope-mark-no" aria-hidden="true">&times;</span>
              <span class="scope-text">Pages you did not select, or pages restricted to people Vendi answers</span>
            </li>
            <li class="scope">
              <span class="scope-mark scope-mark-no" aria-hidden="true">&times;</span>
              <span class="scope-text">Editing a page on its own, without the owner accepting</span>
            </li>
            <li class="scope">
              <span class="scope-mark scope-mark-no" aria-hidden="true">&times;</span>
              <span class="scope-text">Creating, moving, deleting or sharing pages</span>
            </li>
          </ul>
        </div>

        <div class="consent-foot">
          <span class="consent-foot-note">You can change the selection or disconnect Notion at any time.</span>
          <a class="btn" href="#/admin/invite">Cancel</a>
          <a class="btn btn-primary" href="#/admin/channels">Allow access</a>
        </div>
      </div>

      <p class="fake-note mt-md">A drawing of Notion's access screen, not Notion's. No workspace is connected, the page counts are sample data, and the checkboxes tick but store nothing. <em>Allow access</em> moves the walkthrough on.</p>
    </section>

    <section class="section">
      <h2 class="title">Why the wiki gets its own permission</h2>
      <div class="grid-3 mt-lg">
        <article class="card">
          <h3 class="card-title">Notion only</h3>
          <p class="card-body">Confluence, Google Docs and Slack canvases are not in the first version. If the company's knowledge is not in Slack or in Notion, Vendi does not have it.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Reading is not writing</h3>
          <p class="card-body">Allowing this does not let Vendi edit the wiki. Every change is a proposal to one page's owner, who accepts or declines it. There is no automatic edit anywhere in the first version.</p>
        </article>
        <article class="card">
          <h3 class="card-title">A person's own access still wins</h3>
          <p class="card-body">Vendi may have read a page that a particular person cannot open. It will not use that page to answer them, and will not show it as a source.</p>
        </article>
      </div>
    </section>

    <div class="walk-foot">
      <span class="walk-foot-note">Story 3 &middot; screen 3 of 7 &middot; Admin</span>
      <span class="walk-foot-links">
        <a class="walk-link walk-link-home" href="#/visitor/home">&larr; Back to the start</a>
        <a class="walk-link" href="#/admin/invite">Inviting it to channels</a>
        <a class="walk-link" href="#/admin/channels">Choose what it reads &rarr;</a>
      </span>
    </div>
  </div>
</template>

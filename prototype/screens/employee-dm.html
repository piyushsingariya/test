<template data-screen="employee/dm" data-title="Ask Vendi in a DM">
  <div class="page">
    <section class="section">
      <div class="btn-row btn-row-spread">
        <div>
          <p class="eyebrow">Story 1 &middot; Priya, support</p>
          <h1 class="title">The same conversation, in a direct message</h1>
        </div>
        <span class="tag tag-sample">Sample workspace &mdash; made up for this walkthrough</span>
      </div>
      <p class="lede">Same question, same answer, same sources. No mention needed, nobody else in the room, and not one extra thing unlocked because she asked in private.</p>
    </section>

    <section class="section section-sunken">
      <div class="slack-window">
        <div class="slack-rail">
          <p class="slack-team">Northwind</p>
          <p class="slack-rail-label">Channels</p>
          <ul class="slack-rail-list">
            <li><a class="slack-rail-item" href="#/employee/ask">#finance-ops</a></li>
            <li><a class="slack-rail-item" href="#/employee/no-answer">#people-ops</a></li>
            <li><a class="slack-rail-item" href="#/employee/summary">#support</a></li>
          </ul>
          <p class="slack-rail-label">Direct messages</p>
          <ul class="slack-rail-list">
            <li><a class="slack-rail-item" href="#/employee/dm" aria-current="page">Vendi</a></li>
            <li><a class="slack-rail-item" href="#/employee/dm">Ade Salami</a></li>
            <li><a class="slack-rail-item" href="#/employee/dm">Lin Chen</a></li>
          </ul>
        </div>

        <div class="slack-main">
          <div class="slack-head">
            <span class="slack-channel">Vendi</span>
            <span class="slack-app-badge">APP</span>
            <span class="slack-head-note">Only you and Vendi are in here</span>
          </div>

          <div class="slack-body">
            <p class="slack-day">Today</p>

            <div class="slack-message">
              <span class="slack-avatar" aria-hidden="true">PR</span>
              <div>
                <p class="slack-author">Priya Raman <span class="slack-time">08:52</span></p>
                <p class="slack-text">how long do refund requests take to approve now?</p>
              </div>
            </div>

            <div class="slack-message">
              <span class="slack-avatar slack-avatar-vendi" aria-hidden="true">V</span>
              <div>
                <p class="slack-author">Vendi <span class="slack-app-badge">APP</span> <span class="slack-time">08:52</span></p>
                <p class="slack-text">Two business days, not five. Finance shortened it on 4 September: anything under $500 is auto-approved, and the rest goes to one approver instead of two.</p>
                <p class="slack-meta">Read 3 sources</p>
                <ul class="source-list mt-xs">
                  <li><a class="source-chip" href="#/employee/dm">Notion &middot; Refunds policy</a></li>
                  <li><a class="source-chip" href="#/employee/dm">#finance-ops &middot; 4 Sep</a></li>
                  <li><a class="source-chip" href="#/employee/dm">#support &middot; 12 Sep</a></li>
                </ul>
                <div class="slack-card">
                  <p class="slack-card-title">The Notion page still says five days</p>
                  <p class="slack-text">I can draft the correction and send it to the page's owner, Marco Villalba. I will not change the page myself.</p>
                </div>
                <div class="slack-actions">
                  <a class="slack-btn slack-btn-go" href="#/owner/proposal">Send the correction to Marco</a>
                  <a class="slack-btn" href="#/employee/ask">Show me this in the channel</a>
                </div>
                <p class="slack-access">Answered from what you can see. A DM does not widen that &mdash; the same channels and pages, no more.</p>
              </div>
            </div>

            <div class="slack-message">
              <span class="slack-avatar" aria-hidden="true">PR</span>
              <div>
                <p class="slack-author">Priya Raman <span class="slack-time">08:55</span></p>
                <p class="slack-text">and summarise #support for the last 7 days</p>
              </div>
            </div>

            <div class="slack-message">
              <span class="slack-avatar slack-avatar-vendi" aria-hidden="true">V</span>
              <div>
                <p class="slack-author">Vendi <span class="slack-app-badge">APP</span> <span class="slack-time">08:55</span></p>
                <p class="slack-text">Refund timing, Monday's payments outage, iOS login loops, and billing address edits. Four themes across the week.</p>
                <ul class="slack-facts">
                  <li class="slack-fact">#support only</li>
                  <li class="slack-fact">23&ndash;30 September</li>
                  <li class="slack-fact">63 threads</li>
                </ul>
                <div class="slack-actions">
                  <a class="slack-btn" href="#/employee/summary">Open the full summary</a>
                  <a class="slack-btn" href="#/employee/shorter">Shorter</a>
                </div>
                <p class="slack-access">I can summarise a channel here, but only one you are in. Asking in a DM does not get you a channel you are not a member of.</p>
              </div>
            </div>
          </div>

          <div class="slack-composer">
            <span>Message Vendi</span>
            <button type="button" class="slack-send">Send</button>
          </div>
        </div>
      </div>

      <p class="fake-note mt-md">A drawing of Slack, not Slack. The composer does not type and nothing here is sent.</p>
    </section>

    <section class="section">
      <h2 class="title">What a DM changes, and what it does not</h2>
      <div class="grid-3 mt-lg">
        <article class="card">
          <h3 class="card-title">No mention needed</h3>
          <p class="card-body">In a channel Vendi answers when it is mentioned. In a DM every message is for it.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Nobody else reads it</h3>
          <p class="card-body">The answer stays between the two of you. Nothing is posted to a channel unless you ask for it there.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Access is unchanged</h3>
          <p class="card-body">Same channels, same pages. A private question does not open a private channel.</p>
        </article>
      </div>
    </section>

    <div class="walk-foot">
      <span class="walk-foot-note">Story 1 &middot; screen 7 of 7 &middot; Employee</span>
      <span class="walk-foot-links">
        <a class="walk-link walk-link-home" href="#/employee/no-answer">&larr; When Vendi doesn't know</a>
        <a class="walk-link" href="#/owner/proposal">Story 2: the page owner &rarr;</a>
      </span>
    </div>
  </div>
</template>

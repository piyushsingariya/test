                  <li><strong>Login loops on iOS.</strong> Engineering shipped a fix on Thursday. Three customers who reported it have not been written back to.</li>
                  <li><strong>Editing a billing address.</strong> Asked four times, answered four times by Ade, written down nowhere.</li>
                </ul>

    <main class="main" id="main">
      <section class="section">
        <div class="wrap">
          <h1 class="h1">Get in touch</h1>
          <p class="lede">Say what it is about and it reaches Piyush directly. He does not sign in anywhere to read it.</p>
          <div class="error-summary" role="alert" style="margin-top: var(--space-lg);">
            <strong>One thing is missing.</strong> Say why you are reaching out, so Piyush can tell your message apart from the others.
          </div>

          <div class="contact-grid" style="margin-top: var(--space-xl);">
            <form class="form">
              <div class="field">
                <label class="label" for="c-name">Your name <span class="req" aria-hidden="true">*</span></label>
                <input class="input" id="c-name" name="name" type="text" placeholder="Who is writing" value="Sample Visitor">
              </div>

              <div class="field">
                <label class="label" for="c-reply">How should he reply? <span class="req" aria-hidden="true">*</span></label>
                <input class="input" id="c-reply" name="reply" type="text" placeholder="An email address, or a link to you" value="sample.visitor@example.com">
                <p class="hint">Yours, not his &mdash; his is never printed on the page.</p>
              </div>

              <fieldset class="fieldset" aria-describedby="reason-error">
                <legend class="legend">Why are you reaching out? <span class="req" aria-hidden="true">*</span></legend>
                <p class="hint">This rides along with the message, so he can tell a role, a project and a hello apart at a glance.</p>
                <div class="choices is-error">
                  <label class="choice">
                    <input type="radio" name="reason" value="role">
                    <span>
                      <span class="choice-name">A role at a company</span>
                      <span class="choice-note">Hiring, or thinking about it.</span>
                    </span>
                  </label>
                  <label class="choice">
                    <input type="radio" name="reason" value="freelance">
                    <span>
                      <span class="choice-name">Freelance or contract work</span>
                      <span class="choice-note">A project, a scope, a budget.</span>
                    </span>
                  </label>
                  <label class="choice">
                    <input type="radio" name="reason" value="other">
                    <span>
                      <span class="choice-name">Something else</span>
                      <span class="choice-note">A question, an introduction, or just saying hello.</span>
                    </span>
                  </label>
                </div>
                <p class="error-text" id="reason-error">Pick one &mdash; this is the part Piyush reads first.</p>
              </fieldset>

              <div class="field">
                <label class="label" for="c-message">Your message <span class="req" aria-hidden="true">*</span></label>
                <textarea class="textarea" id="c-message" name="message" rows="6" placeholder="What it is about, and anything he should know">Read the data pipeline story and wanted to ask how you would approach ours. Are you taking on contract work at the moment?</textarea>
              </div>

              <div class="row">
                <a class="btn btn-primary" href="#/visitor/contact-sent">Send message</a>
                <span class="sample">Nothing sends</span>
              </div>

              <p class="fake-note">This is a walkthrough: the button goes straight to the confirmation screen. On the built site the message reaches Piyush directly, with the reason attached. Want to see what a missed field looks like? <a class="link" href="#/visitor/contact-error">The error state is here.</a></p>
            </form>

            <div class="card">
              <p class="h4">Or find him elsewhere</p>
              <ul class="channels" style="margin-top: var(--space-sm);">
                <li><a class="channel link-out" href="https://github.com/piyushsingariya" rel="noreferrer noopener" target="_blank"><span>GitHub</span><span class="meta">piyushsingariya</span></a></li>
                <li><a class="channel link-out" href="https://www.linkedin.com/in/piyushsingariya" rel="noreferrer noopener" target="_blank"><span>LinkedIn</span><span class="meta">piyushsingariya</span></a></li>
                <li><a class="channel" href="#/visitor/resume"><span>His r&eacute;sum&eacute;</span><span class="meta">PDF</span></a></li>
              </ul>
              <p class="meta" style="margin-top: var(--space-md);">His email address and phone number are never printed on the page. The form is how a stranger reaches him.</p>
              <p><span class="sample">Sample list</span></p>
            </div>
          </div>

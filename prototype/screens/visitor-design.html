      <main class="page">
        <h1 class="section-title">How this site is drawn</h1>
        <p class="lede">A tankōbon volume about one engineer: pulp paper, hard ink rules, one spot of press red, and the structure of a shonen databook: the page that says what this character actually did, as against what his party did.</p>
        <div class="panel">
          <p class="panel-title">Colour: restrained, one hue</p>
          <div class="prose"><p>Paper and press black carry the site. The red only marks what is live: what he is open to, the section you are on, the action, and the line that says what he personally did. Nothing else is coloured.</p></div>
          <ul class="swatches">
            <li><div class="swatch sw-paper"></div><span class="swatch-name">Paper</span><span class="swatch-job">The page. Pulp, slightly green-grey, not cream.</span></li>
            <li><div class="swatch sw-panel"></div><span class="swatch-name">Panel</span><span class="swatch-job">The brighter stock a panel is printed on.</span></li>
            <li><div class="swatch sw-ink"></div><span class="swatch-name">Ink</span><span class="swatch-job">Press black. Every word and every rule.</span></li>
            <li><div class="swatch sw-red"></div><span class="swatch-name">Press red</span><span class="swatch-job">Availability, current section, action.</span></li>
            <li><div class="swatch sw-tone"></div><span class="swatch-name">Tone</span><span class="swatch-job">Screentone fill and sunken areas.</span></li>
            <li><div class="swatch sw-pencil"></div><span class="swatch-name">Pencil</span><span class="swatch-job">Secondary text and the credit block.</span></li>
          </ul>
        </div>
        <div class="panel">
          <p class="panel-title">Type: two faces, 1.25 between steps</p>
          <table class="scale">
            <thead><tr><th>Specimen</th><th>Job</th><th>Size</th></tr></thead>
            <tbody>
              <tr><td class="spec-4xl">Singariya</td><td>Bowlby One SC, the cover logo on the landing screen</td><td>3.815rem</td></tr>
              <tr><td class="spec-2xl">The work</td><td>Bowlby One SC, section titles</td><td>2.441rem</td></tr>
              <tr><td class="spec-md">What I did on it</td><td>M PLUS 2 medium, lede and panel titles</td><td>1.25rem</td></tr>
              <tr><td class="spec-base">He designed the storage engine and shipped it.</td><td>M PLUS 2 regular, body at 65 to 75 characters a line</td><td>1rem</td></tr>
              <tr><td class="spec-sm">Sample wording: Piyush to confirm</td><td>M PLUS 2 small, captions, flags and the credit block</td><td>0.8rem</td></tr>
              <tr><td class="spec-mono">gear6io/gear6 a3f91c2 412ms</td><td>M PLUS 1 Code, short SHAs, paths and durations. Never a label.</td><td>0.8rem</td></tr>
            </tbody>
          </table>
        </div>
        <div class="panel">
          <p class="panel-title">Space and shape</p>
          <div class="prose"><p>Radius is zero everywhere: a printed page has no rounded corners. A surface is set apart by a 2px ink rule, never by a soft shadow. The one exception is the portrait on the landing screen, which has a flat offset ink shadow and no border, the way a photo is tipped onto a page. One column of panels, never a grid of cards.</p></div>
          <ul class="ruler">
            <li><i class="r-1"></i><span>4px, inside a label</span></li>
            <li><i class="r-2"></i><span>8px, between an icon and its word</span></li>
            <li><i class="r-4"></i><span>16px, between lines of a paragraph block</span></li>
            <li><i class="r-6"></i><span>24px, inside a panel</span></li>
            <li><i class="r-7"></i><span>32px, between panels</span></li>
            <li><i class="r-10"></i><span>64px, between sections of a screen</span></li>
          </ul>
        </div>
        <div class="panel">
          <p class="panel-title">Motion and the playfulness</p>
          <div class="prose"><p>Motion only shows a change of state: 200ms, ease-out, colour and transform only, and it is switched off for anyone who asks their system for less motion. Hover a row on the landing screen and its arrow steps right. Nothing else moves.</p>
          <p>The playfulness is in the words and in one object, not in decoration. The words are his: the bio stays as he wrote it, the contact screen says out loud what he does not want to hear about. The object is the <b>obi</b>: the red paper band printed with one selling line and wrapped around a Japanese book, fixed here under the masthead on every screen, carrying what he is open to. It is the only saturated surface on the site.</p>
          <p>What this site turns down: the near-black terminal with acid-green mono, the cream serif résumé, a three-up grid of project cards, a logo cloud of skills, and any anime artwork he does not own.</p></div>
        </div>

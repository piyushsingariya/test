          <summary class="menu-button">Menu <span aria-hidden="true">▾</span></summary>
          <nav class="menu-panel" aria-label="Main, narrow screens">
            <a class="nav-link" href="#/visitor/work">Work</a>
            <a class="nav-link" href="#/visitor/open-source">Open source</a>

    <main class="main" id="main">
      <section class="section">
        <div class="wrap">
          <p class="eyebrow">Design language</p>
          <h1 class="h1">Every later screen is drawn from this page.</h1>
          <p class="lede">Warm paper, near-black ink and one burnt-orange accent. A serif for headings so the work reads like an editorial page; a system sans for everything you have to read quickly. Set once here, reused everywhere.</p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <h2 class="h2">Type scale</h2>
          <div style="margin-top: var(--space-lg);">
            <div class="spec-row"><span class="spec-name">--font-size-4xl / 52px</span><p class="display">Display — the opening line</p></div>
            <div class="spec-row"><span class="spec-name">--font-size-3xl / 38px</span><p class="h1">Heading 1 — a page title</p></div>
            <div class="spec-row"><span class="spec-name">--font-size-2xl / 28px</span><p class="h2">Heading 2 — a section</p></div>
            <div class="spec-row"><span class="spec-name">--font-size-xl / 22px</span><p class="h3">Heading 3 — a card or a role</p></div>
            <div class="spec-row"><span class="spec-name">--font-size-lg / 18px</span><p class="lede" style="margin-top: 0;">Lede — the sentence under a heading</p></div>
            <div class="spec-row"><span class="spec-name">--font-size-md / 16px</span><p>Body — the size everything is read at.</p></div>
            <div class="spec-row"><span class="spec-name">--font-size-sm / 14px</span><p class="meta">Meta — dates, roles, captions.</p></div>
            <div class="spec-row"><span class="spec-name">--font-size-xs / 13px</span><p><span class="tag">Tag</span> <span class="sample">Label</span> — the smallest size on the site, used only for tags and labels.</p></div>
          </div>
        </div>
      </section>

      <section class="section section-sunken">
        <div class="wrap">
          <h2 class="h2">Colour</h2>
          <p class="meta" style="margin-top: var(--space-xs);">Ink on paper meets normal contrast levels. The accent carries actions; the blue carries focus, so focus never hides inside a hover.</p>
          <div class="swatch-grid" style="margin-top: var(--space-lg);">
            <div class="swatch"><div class="swatch-chip chip-bg"></div><div class="swatch-body"><p class="swatch-name">--color-bg</p><p class="swatch-use">Page</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-surface"></div><div class="swatch-body"><p class="swatch-name">--color-surface</p><p class="swatch-use">Cards, inputs</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-sunken"></div><div class="swatch-body"><p class="swatch-name">--color-surface-sunken</p><p class="swatch-use">Banded sections</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-line"></div><div class="swatch-body"><p class="swatch-name">--color-line</p><p class="swatch-use">Borders, rules</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-ink"></div><div class="swatch-body"><p class="swatch-name">--color-ink</p><p class="swatch-use">Headings, body</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-ink-soft"></div><div class="swatch-body"><p class="swatch-name">--color-ink-soft</p><p class="swatch-use">Secondary text</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-ink-faint"></div><div class="swatch-body"><p class="swatch-name">--color-ink-faint</p><p class="swatch-use">Meta text</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-dark"></div><div class="swatch-body"><p class="swatch-name">--color-dark</p><p class="swatch-use">Footer</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-accent"></div><div class="swatch-body"><p class="swatch-name">--color-accent</p><p class="swatch-use">Primary action</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-accent-ink"></div><div class="swatch-body"><p class="swatch-name">--color-accent-ink</p><p class="swatch-use">Links, hover</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-accent-soft"></div><div class="swatch-body"><p class="swatch-name">--color-accent-soft</p><p class="swatch-use">Accent fill</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-focus"></div><div class="swatch-body"><p class="swatch-name">--color-focus</p><p class="swatch-use">Focus ring</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-good"></div><div class="swatch-body"><p class="swatch-name">--color-good</p><p class="swatch-use">Sent, confirmed</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-fake"></div><div class="swatch-body"><p class="swatch-name">--color-fake</p><p class="swatch-use">Sample labels</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-disabled"></div><div class="swatch-body"><p class="swatch-name">--color-disabled</p><p class="swatch-use">Disabled</p></div></div>
            <div class="swatch"><div class="swatch-chip chip-ink" style="background: var(--color-line-strong);"></div><div class="swatch-body"><p class="swatch-name">--color-line-strong</p><p class="swatch-use">Input borders</p></div></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <h2 class="h2">Spacing</h2>
          <p class="meta" style="margin-top: var(--space-xs);">Ten steps. Nothing on the site uses a gap that is not one of them.</p>
          <div style="margin-top: var(--space-lg);">
            <div class="spec-row"><span class="spec-name">--space-3xs / 2px</span><div class="space-bar w-3xs"></div></div>
            <div class="spec-row"><span class="spec-name">--space-2xs / 4px</span><div class="space-bar w-2xs"></div></div>
            <div class="spec-row"><span class="spec-name">--space-xs / 8px</span><div class="space-bar w-xs"></div></div>
            <div class="spec-row"><span class="spec-name">--space-sm / 12px</span><div class="space-bar w-sm"></div></div>
            <div class="spec-row"><span class="spec-name">--space-md / 16px</span><div class="space-bar w-md"></div></div>
            <div class="spec-row"><span class="spec-name">--space-lg / 24px</span><div class="space-bar w-lg"></div></div>
            <div class="spec-row"><span class="spec-name">--space-xl / 32px</span><div class="space-bar w-xl"></div></div>
            <div class="spec-row"><span class="spec-name">--space-2xl / 48px</span><div class="space-bar w-2xl"></div></div>
            <div class="spec-row"><span class="spec-name">--space-3xl / 72px</span><div class="space-bar w-3xl"></div></div>
            <div class="spec-row"><span class="spec-name">--space-4xl / 104px</span><div class="space-bar w-4xl"></div></div>
          </div>

          <hr class="rule">

          <h2 class="h2">Corners and shadow</h2>
          <div class="grid-2" style="margin-top: var(--space-lg);">
            <div class="stack">
              <div class="radius-box r-xs"></div><p class="state-name">--radius-xs</p>
              <div class="radius-box r-sm"></div><p class="state-name">--radius-sm · buttons, inputs</p>
              <div class="radius-box r-md"></div><p class="state-name">--radius-md · cards, images</p>
              <div class="radius-box r-lg"></div><p class="state-name">--radius-lg</p>
              <div class="radius-box r-pill"></div><p class="state-name">--radius-pill · tags</p>
            </div>
            <div class="stack">
              <div class="shadow-box s-sm"></div><p class="state-name">--shadow-sm · card at rest</p>
              <div class="shadow-box s-md"></div><p class="state-name">--shadow-md · card on hover</p>
              <div class="shadow-box s-lg"></div><p class="state-name">--shadow-lg · menu over the page</p>
            </div>
          </div>
        </div>
      </section>

      <section class="section section-sunken">
        <div class="wrap">
          <h2 class="h2">Buttons</h2>
          <p class="meta" style="margin-top: var(--space-xs);">Every state, shown at once. Each one is at least 44px tall, so it is reachable by thumb.</p>

          <h3 class="h4" style="margin-top: var(--space-lg);">Primary</h3>
          <div class="state-grid" style="margin-top: var(--space-md);">
            <div class="state-cell"><a class="btn btn-primary" href="#/visitor/contact">Get in touch</a><span class="state-name">default</span></div>
            <div class="state-cell"><a class="btn btn-primary is-hover" href="#/visitor/contact">Get in touch</a><span class="state-name">hover</span></div>
            <div class="state-cell"><a class="btn btn-primary is-focus" href="#/visitor/contact">Get in touch</a><span class="state-name">focus</span></div>
            <div class="state-cell"><a class="btn btn-primary is-active" href="#/visitor/contact">Get in touch</a><span class="state-name">active</span></div>
            <div class="state-cell"><span class="btn btn-primary" aria-disabled="true" role="button">Sending…</span><span class="state-name">disabled</span></div>
          </div>

          <h3 class="h4" style="margin-top: var(--space-xl);">Secondary</h3>
          <div class="state-grid" style="margin-top: var(--space-md);">
            <div class="state-cell"><a class="btn btn-secondary" href="#/visitor/resume">Download résumé</a><span class="state-name">default</span></div>
            <div class="state-cell"><a class="btn btn-secondary is-hover" href="#/visitor/resume">Download résumé</a><span class="state-name">hover</span></div>
            <div class="state-cell"><a class="btn btn-secondary is-focus" href="#/visitor/resume">Download résumé</a><span class="state-name">focus</span></div>
            <div class="state-cell"><a class="btn btn-secondary is-active" href="#/visitor/resume">Download résumé</a><span class="state-name">active</span></div>
            <div class="state-cell"><span class="btn btn-secondary" aria-disabled="true" role="button">Download résumé</span><span class="state-name">disabled</span></div>
          </div>

          <h3 class="h4" style="margin-top: var(--space-xl);">Quiet</h3>
          <div class="state-grid" style="margin-top: var(--space-md);">
            <div class="state-cell"><a class="btn btn-quiet" href="#/visitor/work">See all work</a><span class="state-name">default</span></div>
            <div class="state-cell"><a class="btn btn-quiet is-hover" href="#/visitor/work">See all work</a><span class="state-name">hover</span></div>
            <div class="state-cell"><a class="btn btn-quiet is-focus" href="#/visitor/work">See all work</a><span class="state-name">focus</span></div>
          </div>

          <hr class="rule">

          <h2 class="h2">Links</h2>
          <div class="state-grid" style="margin-top: var(--space-md);">
            <div class="state-cell"><a class="link" href="#/visitor/career">the career history</a><span class="state-name">default</span></div>
            <div class="state-cell"><a class="link is-hover" href="#/visitor/career">the career history</a><span class="state-name">hover</span></div>
            <div class="state-cell"><a class="link is-focus" href="#/visitor/career">the career history</a><span class="state-name">focus</span></div>
            <div class="state-cell"><a class="link is-active" href="#/visitor/career">the career history</a><span class="state-name">active</span></div>
            <div class="state-cell"><a class="link link-out" href="https://github.com/piyushsingariya" rel="noreferrer noopener" target="_blank">the repository</a><span class="state-name">leaves the site</span></div>
            <div class="state-cell"><span class="link is-disabled">not yet added</span><span class="state-name">unavailable</span></div>
          </div>

          <hr class="rule">

          <h2 class="h2">Tags</h2>
          <div class="row" style="margin-top: var(--space-md);">
            <span class="tag">Go</span>
            <span class="tag">Kubernetes</span>
            <span class="tag tag-accent">Featured</span>
            <span class="tag tag-open">Maintainer</span>
            <span class="sample">Sample</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <h2 class="h2">Cards</h2>
          <p class="meta" style="margin-top: var(--space-xs);">A whole card is the link. Work, roles, open source and credentials all reuse it.</p>
          <div class="grid-3" style="margin-top: var(--space-lg);">
            <a class="card card-feature" href="#/visitor/work">
              <div class="image image-wide image-flush"><span class="image-label">Sample image</span></div>
              <div class="card-body">
                <p class="card-title">Work card</p>
                <p class="card-meta">Role · 2024–2025</p>
                <p class="card-outcome">The outcome in one line.</p>
                <div class="row"><span class="tag">Go</span><span class="tag">Postgres</span></div>
              </div>
            </a>

            <a class="card card-feature is-hover" href="#/visitor/work">
              <div class="image image-wide image-flush"><span class="image-label">Sample image</span></div>
              <div class="card-body">
                <p class="card-title">Work card</p>
                <p class="card-meta">Role · 2024–2025</p>
                <p class="card-outcome">The same card, on hover: it lifts and the shadow deepens.</p>
                <div class="row"><span class="tag">Go</span><span class="tag">Postgres</span></div>
              </div>
            </a>

            <div class="card">
              <p class="card-title">Plain card</p>
              <p class="card-meta">Employer · 2022–2024</p>
              <p class="card-outcome">No image, no link: a role in the career history, or a credential.</p>
            </div>
          </div>

          <hr class="rule">

          <h2 class="h2">Images</h2>
          <p class="meta" style="margin-top: var(--space-xs);">The walkthrough loads nothing from outside, so every image is a labelled placeholder. Each one keeps the shape the real image will take.</p>
          <div class="grid-3" style="margin-top: var(--space-lg);">
            <div><div class="image image-wide"><span class="image-label">Sample image</span></div><p class="state-name" style="margin-top: var(--space-xs);">16:9 · work, previews</p></div>
            <div><div class="image image-square"><span class="image-label">Sample image</span></div><p class="state-name" style="margin-top: var(--space-xs);">1:1 · logos, thumbnails</p></div>
            <div><div class="image image-portrait"><span class="image-label">Sample photo</span></div><p class="state-name" style="margin-top: var(--space-xs);">4:5 · his photo on About</p></div>
          </div>

          <hr class="rule">

          <h2 class="h2">Fields</h2>
          <p class="meta" style="margin-top: var(--space-xs);">The contact form is built in the next step; these are the parts it is made of.</p>
          <div class="grid-2" style="margin-top: var(--space-lg); max-width: var(--size-prose);">
            <div class="field"><label class="label" for="dl-name">Your name</label><input class="input" id="dl-name" type="text" placeholder="Sample name"></div>
            <div class="field"><label class="label" for="dl-why">Why you are reaching out</label><select class="select" id="dl-why"><option>A role</option><option>Freelance or contract work</option><option>Something else</option></select></div>
          </div>
          <div class="field" style="margin-top: var(--space-md); max-width: var(--size-prose);"><label class="label" for="dl-msg">Message</label><textarea class="textarea" id="dl-msg" placeholder="Sample message"></textarea></div>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <h2 class="h2">The card a shared link shows</h2>
          <p class="meta" style="margin-top: var(--space-xs);">One link has to work in a message, a DM or a job application. Every page carries its own title, description and preview image, so it never arrives as a bare URL — and his name is spelled <strong>Piyush Singariya</strong> in all three.</p>

          <div class="linkcard" style="margin-top: var(--space-lg);">
            <div class="image image-wide"><span class="image-label">Sample preview image</span></div>
            <div class="linkcard-body">
              <p class="linkcard-host">piyushsingariya.com</p>
              <p class="linkcard-title">Piyush Singariya — software engineer, exploring entrepreneurship</p>
              <p class="linkcard-desc">The work he is proudest of, his full career history, and how to reach him. <span class="sample">Sample copy</span></p>
            </div>
          </div>

          <div class="stack" style="margin-top: var(--space-lg); max-width: var(--size-prose);">
            <p class="meta">Each page sets its own three: a work story page carries that project&rsquo;s title and preview image, the career page carries its own. The domain above is a placeholder until Piyush picks one.</p>
          </div>
        </div>
      </section>

      <section class="section section-sunken">
        <div class="wrap">
          <h2 class="h2">The shell, and moving through it with a keyboard</h2>
          <p class="lede">The header sticks to the top of every page and carries his name and the six places a visitor goes. At phone width the six collapse behind a menu, and the résumé button moves into it. The footer repeats all of it, plus where to find him elsewhere.</p>

          <div class="mini-head" style="margin-top: var(--space-lg);">
            <span class="brand-name">Piyush Singariya</span>
            <a class="nav-link" href="#/visitor/work">Work</a>
            <a class="nav-link" href="#/visitor/open-source" aria-current="page">Open source</a>
            <a class="nav-link is-hover" href="#/visitor/career" style="background: var(--color-surface-sunken); color: var(--color-ink);">Career</a>
            <a class="nav-link is-focus" href="#/visitor/credentials" style="outline: var(--border-focus) solid var(--color-focus); outline-offset: var(--space-3xs);">Credentials</a>
          </div>
          <p class="state-name" style="margin-top: var(--space-xs);">default · current page · hover · keyboard focus</p>

          <div class="stack" style="margin-top: var(--space-xl); max-width: var(--size-prose);">
            <p>Press <strong>Tab</strong> from the top of any screen. The order is: skip link, his name, each header item, the résumé button, then the page, then the footer. Every stop draws a 3px blue ring with a little breathing room around it — the same ring on links, buttons, fields and the menu, so nothing you reach is invisible.</p>
            <p>The first stop is the skip link. It sits off-screen until it takes focus, then drops into the corner and jumps straight past the header to the page.</p>
          </div>

          <div class="row" style="margin-top: var(--space-lg);">
            <a class="btn btn-secondary" href="#/visitor/home">Back to the start</a>
            <a class="btn btn-quiet" href="#/visitor/contact">Contact</a>
          </div>
        </div>
      </section>
    </main>

              <li><a class="foot-link link-out" href="https://github.com/piyushsingariya" rel="noreferrer noopener" target="_blank">GitHub</a></li>

    </footer>
  </div>
</template>

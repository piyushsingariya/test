    <section class="section">
      <p class="eyebrow">An AI coworker in Slack</p>
      <h1 class="display">Vendi already knows how your company works.</h1>
      <p class="subtitle">Vendi sits in your Slack with the context your team has built up — threads, channels, and your Notion wiki. Ask it a question and it answers with the sources it used. Ask it to summarise a thread and it does. And when Slack settles something the wiki still gets wrong, Vendi writes the edit and sends it to the page's owner.</p>
      <div class="btn-row mt-lg">
        <a class="btn btn-primary btn-lg" href="#/admin/install">Add Vendi to Slack</a>
        <span class="tag tag-fake">Prototype — nothing installs</span>
      </div>
      <p class="fake-note mt-xs">Nothing installs. Vendi is not built yet; this button opens the screen an admin would see, and this walkthrough is how those screens get agreed.</p>
    </section>

    <section class="section section-sunken">
      <h2 class="title">What Vendi does</h2>
      <p class="lede">Three things in the first version. Nothing else.</p>
      <div class="grid-3 mt-lg">
        <article class="card">
          <h3 class="card-title">Answers, with its sources</h3>
          <p class="card-body">Ask in a channel or a DM. Vendi answers from your Slack history and your Notion wiki, and shows every page and message it read. If it cannot find the answer, it says so instead of guessing.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Summarises a thread or a channel</h3>
          <p class="card-body">Mention Vendi in a long thread and it writes up what was said, what was decided, and what is still open — in the thread, where everyone can see it.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Keeps Notion honest</h3>
          <p class="card-body">When a Slack thread settles something the wiki contradicts, Vendi drafts the page edit and sends it to that page's owner. The owner accepts or declines it.</p>
        </article>
      </div>
    </section>

    <section class="section">

        <span class="tag tag-sample">Sample conversation — made up for this walkthrough</span>

      <p class="lede">Short, plain, and never more certain than its sources.</p>

      <div class="slack mt-lg">

          <div>
            <p class="slack-author">Priya Raman <span class="slack-time">10:42</span></p>
            <p class="slack-text">@Vendi how long do refund requests take to approve now? I keep telling customers five days and I'm not sure that's still right.</p>
          </div>
        </div>

        <div class="slack-message">
          <span class="slack-avatar slack-avatar-vendi" aria-hidden="true">V</span>
          <div>
            <p class="slack-author">Vendi <span class="slack-app-badge">APP</span> <span class="slack-time">10:42</span></p>
            <p class="slack-text">Two business days, not five. Finance shortened it on 4 September when the new approval rule went live — anything under $500 is auto-approved and the rest goes to one approver instead of two.</p>
            <div class="slack-block">
              <p class="slack-text">Heads up: the Notion page still says five days. Want me to send the correction to its owner?</p>
            </div>
            <ul class="source-list mt-xs">
              <li><span class="source-chip">Notion · Refunds policy</span></li>
              <li><span class="source-chip">#finance-ops · 4 Sep</span></li>

            </ul>
          </div>
        </div>
      </div>

      <div class="grid-2 mt-lg">
        <article class="card">
          <h3 class="card-title">It shows its work</h3>
          <p class="card-body">Every answer carries the messages and pages it came from, so you can check it in one click.</p>
        </article>
        <article class="card">
          <h3 class="card-title">It says when it doesn't know</h3>
          <p class="card-body">No source, no answer. Vendi tells you what it looked at and who is likely to know instead.</p>
        </article>
      </div>
    </section>

    <section class="section section-sunken">
      <h2 class="title">What Vendi does not do</h2>
      <p class="lede">Worth saying plainly, because a coworker with your company's context should have limits.</p>
      <div class="grid-3 mt-lg">
        <article class="card">
          <h3 class="card-title">It never edits the wiki on its own</h3>
          <p class="card-body">Every Notion change is a proposal. The page's owner accepts or declines it, and nothing changes until they do.</p>
        </article>
        <article class="card">
          <h3 class="card-title">Slack only, Notion only</h3>
          <p class="card-body">The first version lives in Slack and reads Notion. No other chat tool, no other wiki.</p>
        </article>
        <article class="card">
          <h3 class="card-title">It doesn't act in your other tools</h3>
          <p class="card-body">Vendi will not file a ticket, send an email or change a record anywhere else. It answers, it summarises, it proposes.</p>
        </article>
      </div>
    </section>

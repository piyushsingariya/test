            <h1 class="article-title">The span that spent 400&nbsp;ms describing itself</h1>
            <p class="article-meta"><span><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M8 2v3m8-3v3"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/></g></svg> 14 Sep 2026</span><span><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g></svg> 6 min</span><span>Post</span></p>
            <p class="article-lead">Someone pasted a trace into the on-call channel with a 400&nbsp;ms hole in it and asked which database was slow. No database was slow. The hole was us, writing down how fast we were.</p>
          </header>
          <div class="article-body">
            <h2>What the waterfall actually showed</h2>
            <p>Six spans, one of them not part of the request at all:</p>
            <pre class="waterfall">GET /checkout                  612 ms
&#9500;&#9472; auth.verify                   4 ms
&#9500;&#9472; cart.load                    21 ms
<b>&#9500;&#9472; otel.export (batch flush)   402 ms  &#8592; this one</b>
&#9492;&#9472; db.query                     18 ms</pre>
            <p>The exporter was flushing on the request thread. Worse, every span carried about 180 attributes, one of which was the whole request body, stringified, because six months earlier that was the fastest way to debug something nobody remembers now.</p>
            <h2>The boring fix</h2>
            <ul>
              <li>Drop the attribute. It was a debugging note from a previous era, kept because deleting things feels like losing them.</li>
              <li>Cap the batch and let the exporter flush on its own thread, where it is free to be slow in private.</li>
              <li>Give it a budget: if telemetry costs more than one percent of the request, telemetry is the bug.</li>
            </ul>
            <p>Request time went back to 210&nbsp;ms. Nothing about the application changed. We just stopped narrating it quite so enthusiastically.</p>
            <blockquote class="article-pull">
              <p>Observability is the only part of your system allowed to be slow and still call itself helpful. Don&rsquo;t let it.</p>
            </blockquote>
            <h2>What I would do differently</h2>
            <p>Measure the measuring first. A span is a write, a batch is a buffer, and an exporter on the hot path is a queue you did not design. The <a href="https://opentelemetry.io/docs/">batch processor&rsquo;s own documentation</a> says most of this, which I read afterwards, in the traditional order.</p>
            <p>Ten minutes in a flamegraph, one line of <code>config.yaml</code>. Not every arc needs a training montage.</p>
          </div>

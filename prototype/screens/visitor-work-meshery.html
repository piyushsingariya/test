        <h1 class="section-title">mesheryctl &mdash; the command line for Meshery</h1>
        <p class="lede">One of the four, in full. Google Summer of Code 2021 with Layer5, then maintainer of
          the part of Meshery a user types into.</p>
        <p class="note">Sample wording standing in for his, except where it says otherwise. Flagged lines are waiting on him and do not ship as copy until he confirms them.</p>
        <section class="panel">
          <h2 class="panel-title">The problem</h2>
          <div class="prose">
            <p>Meshery manages service meshes, and mesheryctl is the door most people come in through. A
              command line with no tests under it makes every change a gamble: reviews get slower, regressions
              land, and the project it fronts feels less solid than it is.</p>
          </div>
        </section>
        <div class="split-two">
          <section class="panel panel-mine">
            <h2 class="panel-title">What I did</h2>
            <div class="prose">
              <p>Took mesheryctl on as a Google Summer of Code 2021 project with Layer5, and stayed with it
                afterwards as a maintainer rather than handing it back.</p>
              <p>Wrote the tests the CLI did not have, taking coverage from near-nothing to
                <span class="flag">his number, with something to point at</span>.</p>
              <p>Reviewed and merged other people&rsquo;s CLI changes, which is the unglamorous half of
                maintaining anything.</p>
            </div>
          </section>
          <section class="panel">
            <h2 class="panel-title">What the team shipped</h2>
            <div class="prose">

                docs site and the releases. Dozens of contributors over years.</p>
              <p>He did not build Meshery. He maintained the part you type into. The two sit side by side here
                on purpose, because a recruiter reading one long paragraph cannot tell them apart.</p>
            </div>
